# coden eval suite — a repeatable regression net.
#
# Each case runs `coden --plain` headless against a workspace and asserts on
# observable OUTCOMES (checkpoint, analysis size, RAG usage, memory persistence,
# build success). The seed cases target the exact failure modes hit during the
# RAG/memory/provider overhaul, so a regression re-surfaces here.
#
# Routing note: the workflow PATH (analyze/plan_only/question/code) is parsed and
# DISPLAYED for inspection but is NOT asserted. The Dispatcher owns routing and
# may legitimately pick a different path for the same prompt (e.g. grounding a
# factual question via analyze). We verify that the right WORK happened, not the
# route taken — so cases lean on outcome signals (build, recall, insights, …).
#
# Run:  go run ./cmd/coden-eval                 # all cases, default workspace = repo
#       go run ./cmd/coden-eval -cases eval/cases.yaml -workspace .
# Uses your ~/.coden/config.yaml (real LLM calls — slow + metered).
#
# A case is either single-turn (`prompt` + `expect`) or multi-turn (`turns:` — a
# list of {prompt, expect}). In a multi-turn case the first turn opens a fresh
# session and every later turn appends to it in a NEW process, so coden must
# reload the session from disk — exercising session persistence + cross-turn
# memory. A case-level `expect.build` (if set) runs once after the final turn.
#
# expect fields (all optional):
#   checkpoint        pass | fail                             (default: pass)
#   min_chars         minimum analysis length
#   rag_hits_min      minimum rag_search hits (RAG actually used)
#   insights_min      minimum insights extracted (memory persisted)
#   recall_min        minimum insights recalled from a PRIOR turn (cross-turn memory)
#   tasks_min         minimum planner tasks in the DAG
#   files_written_min minimum write_file/edit_file calls (executor wrote)
#   build             shell cmd run in the workspace post-run; must exit 0

- name: analyze-uses-rag-and-memory
  prompt: "分析下这个项目的检索(RAG)实现"
  expect:
    checkpoint: pass
    min_chars: 1500       # guards: "analyze does too little"
    rag_hits_min: 1       # guards: RAG not used / empty index
    insights_min: 1       # guards: memory not persisted (headless drain)

- name: plan-only-produces-reviewed-plan
  prompt: "规划如何给这个项目增加配置热重载,只出方案,先别写代码"
  expect:
    checkpoint: pass
    rag_hits_min: 1
    insights_min: 1

# A factual question about the codebase — just verify it completes cleanly.
# Whether the Dispatcher answers directly or grounds it via analyze is its call.
- name: factual-question-answers
  prompt: "这个项目用什么编程语言和数据库?"
  expect:
    checkpoint: pass

- name: greeting-no-crash
  prompt: "你好"
  expect:
    checkpoint: pass      # guards: greeting hanging/crashing (the ACP loop bug)

# The ONLY case that exercises the full multi-agent pipeline end-to-end:
# inputter → searcher → planner → critic → replanner → executor → acceptor →
# secretary. Runs against a throwaway copy of eval/fixtures/calc (the executor's
# writes never touch the repo), then a real `go build` gates the executor's output.
- name: code-gen-implements-and-builds
  prompt: "在 calc.go 里实现 Multiply(a, b int) int 函数,返回 a*b,确保 go build 通过"
  fixture: eval/fixtures/calc
  allow_shell: true
  expect:
    checkpoint: pass
    tasks_min: 1          # planner produced a DAG
    files_written_min: 1  # executor actually wrote a file
    build: "go build ./..."   # the produced code must compile

# A multi-file dependency scenario: an impl file plus a test file that depends on
# it, gated on a real `go test`. Outcome-only by design — the bucket engine's
# readiness+priority scheduling and cross-task DepArtifacts flow (§11) are verified
# DETERMINISTICALLY in scheduler_test.go; here we never assert HOW the planner
# decomposed (1 task writing both files or 2 with a dep are both valid), only that
# both files were written and the dependent tests compose and pass — matching this
# suite's outcome-not-route principle.
- name: multi-task-dependency-builds
  prompt: "在 calc 包里新建 stack.go 实现 IntStack 类型(基于 []int)及 Push/Pop/Len 方法,并在 stack_test.go 写覆盖 Push/Pop/Len 的测试;go test ./... 必须通过"
  fixture: eval/fixtures/calc
  allow_shell: true
  expect:
    checkpoint: pass
    files_written_min: 2     # stack.go + stack_test.go both written (outcome, not plan shape)
    build: "go test ./..."   # impl + dependent tests compose and pass

# Exercises the research WorkflowMode (intent recognition → research) + external
# knowledge lookup (web_search / web_fetch over Go docs — "先查 golang doc"). The
# route and tool are the engine's call, so this asserts only that it completes with
# a substantive answer. NOTE: web_search needs TAVILY_API_KEY; without it the lookup
# falls back to web_fetch / model knowledge, so the assertion stays lenient.
- name: research-looks-up-golang-doc
  workspace: .
  prompt: "查一下 Go 标准库 slices 包提供了哪些常用函数(如 Contains/Sort/Index),简要说明各自用途"
  expect:
    checkpoint: pass
    min_chars: 200

# A code task with an external-package dependency: the executor may resolve it
# inline (web_search/read), via a gather-first investigation task, or a mid-execution
# request_research re-plan — any route is valid. Outcome-gated on a real compile, so
# it tests the research-then-code capability end-to-end (the request_research
# mechanism itself is unit-tested in scheduler_test.go, not asserted here).
- name: code-with-external-dep-builds
  prompt: "在 calc.go 里加一个 Hypot(a, b float64) float64,返回 sqrt(a*a+b*b)(用 Go 标准库 math 包),确保 go build 通过"
  fixture: eval/fixtures/calc
  allow_shell: true
  expect:
    checkpoint: pass
    files_written_min: 1
    build: "go build ./..."

# ── Multi-turn cases ─────────────────────────────────────────────────────────
# Each turn after the first APPENDS to the same session in a NEW process, so the
# session must be reloaded from disk. These guard the conversational paths the
# single-shot cases above can't reach: session persistence + cross-turn memory.

# Turn 1 analyzes (persists insights). Turn 2 is a follow-up question whose
# answer depends on turn 1 — it must recall the persisted insights (recall>=1).
- name: memory-recall-across-turns
  workspace: .
  turns:
    - prompt: "分析下这个项目的检索(RAG)实现,用了什么存储引擎和排序算法"
      expect:
        checkpoint: pass
        insights_min: 1     # turn 1 must persist memory
    - prompt: "基于你刚才的分析,再用一句话总结 RAG 的存储引擎是什么"
      expect:
        checkpoint: pass
        recall_min: 1       # turn 2 (new process) must recall it

# Two coding turns against ONE throwaway calc module: turn 2 builds on turn 1's
# file. A single final `go build` gates the accumulated result; each turn also
# asserts it wrote a file so a turn that silently did nothing is caught.
- name: multi-turn-code-accumulates
  fixture: eval/fixtures/calc
  allow_shell: true
  turns:
    - prompt: "在 calc.go 里实现 Multiply(a, b int) int,返回 a*b"
      expect:
        checkpoint: pass
        files_written_min: 1
    - prompt: "再在 calc.go 里加一个 Divide(a, b int) int,返回 a/b(b 为 0 时返回 0)"
      expect:
        checkpoint: pass
        files_written_min: 1
  expect:
    build: "go build ./..."   # both turns' code must compile together
