      version_cmd:
        - golangci-lint
        - --version
      install_hint: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      priority: 100
      indicators:
        - go.mod
        - .golangci.yml
    - name: ruff
      category: linter
      languages:
        - python
      command: ruff
      args:
        - check
      version_cmd:
        - ruff
        - --version
      install_hint: pip install ruff
      priority: 100
      indicators:
        - pyproject.toml
        - ruff.toml
    - name: mypy
      category: linter
      languages:
