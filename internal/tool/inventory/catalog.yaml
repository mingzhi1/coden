    - name: black
      category: formatter
      languages:
        - python
      command: black
      version_cmd:
        - black
        - --version
      install_hint: pip install black
      priority: 100
      indicators:
        - pyproject.toml
        - setup.py
        - requirements.txt
    - name: isort
      category: formatter
      languages:
        - python
      command: isort
      version_cmd:
        - isort
        - --version
      install_hint: pip install isort
      priority: 80
      indicators:
        - pyproject.toml
        - .isort.cfg
        - setup.cfg
    - name: prettier
      category: formatter
      languages:
        - javascript
        - typescript
        - css
        - html
        - json
        - yaml
        - markdown
      command: prettier
      args:
        - --write
      version_cmd:
        - prettier
        - --version
      install_hint: npm install -g prettier
      priority: 100
      indicators:
        - package.json
